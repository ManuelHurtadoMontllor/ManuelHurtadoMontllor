    <text x="150" y="31" fill="#9bb3ff" font-size="12" font-weight="700" letter-spacing="1.4">PORTFOLIO</text>
    <text x="150" y="50" fill="#f1f4fa" font-size="16" font-weight="600">🚀 Visita mi portfolio</text>
